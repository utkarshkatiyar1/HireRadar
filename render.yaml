services:
  # Single merged service: Express API + scrape cron + both BullMQ workers
  # (pipeline-worker, apply-worker) all run in this one process. Previously
  # split across 3 Render services for isolation (a Playwright/Chromium
  # crash in apply-worker couldn't take down job evaluation or the API) —
  # merged back because Render's free tier grants only 750 instance-hours
  # per WORKSPACE per month, shared across every service, and UptimeRobot
  # pinging all 3 every 5 min to stop them spinning down meant ~3x730h/month
  # combined, far past the 750h budget. Trade-off: a Playwright OOM/crash
  # can now take the whole process down, not just the apply pipeline —
  # acceptable while solo-user and APPLY_DRY_RUN=true; Render auto-restarts
  # a crashed process. Revisit (split back out, or upgrade plan) if usage
  # grows enough that Playwright crash frequency becomes a real problem.
  - type: web
    name: hireradar-api
    runtime: node
    rootDir: server
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.browsers npx playwright install chromium
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.browsers
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SCREENSHOT_SIGNING_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL_FAST
        value: gemini-flash-lite-latest
      - key: LLM_MODEL_QUALITY
        value: gemini-flash-latest
      - key: LLM_DAILY_REQUEST_LIMIT
        value: "100"
      - key: PIPELINE_CONCURRENCY
        value: "3"
      - key: APPLY_DRY_RUN
        value: "true"
      - key: APPLY_CONCURRENCY
        value: "1"
      - key: INSPECTION_CONCURRENCY
        value: "2"
      # Distinct from this service's own Render-injected PORT (Express/API) —
      # each in-process worker's trivial health HTTP listener needs its own
      # port so the three .listen() calls in this one process don't collide.
      - key: PIPELINE_WORKER_PORT
        value: "10001"
      - key: APPLY_WORKER_PORT
        value: "10002"
